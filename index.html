<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
    <link rel="icon" href="/logo/favicon.ico" />

    <!-- Preload the primary UI font so it downloads in parallel with the JS
         bundle and is usually ready before text first paints. Paired with
         `font-display: swap` in index.css: when preload wins there is little or
         no layout shift; on a slow first load we still adopt Assistant once it
         arrives instead of staying on the system fallback for the visit. -->
    <link
      rel="preload"
      href="/fonts/Assistant-VariableFont_wght.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ten10 - ניהול מעשרות חכם</title>
    <meta
      name="description"
      content="המערכת המתקדמת לניהול מעשרות. חישובים אוטומטיים, תזכורות חכמות, גרסת ווב ודסקטופ. מאושר הלכתית."
    />
    <meta
      name="keywords"
      content="מעשר, מעשרות, צדקה, תרומות, הלכה, יהדות, חישוב מעשר, ניהול כספים יהודי"
    />
    <meta name="author" content="Ten10 Development Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ten10 - ניהול מעשרות חכם" />
    <meta
      property="og:description"
      content="המערכת המתקדמת לניהול מעשרות. חישובים אוטומטיים, תזכורות חכמות, גרסת ווב ודסקטופ."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:url" content="https://ten10-app.com" />
    <meta property="og:site_name" content="Ten10" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Ten10 - ניהול מעשרות חכם" />
    <meta
      property="twitter:description"
      content="המערכת המתקדמת לניהול מעשרות. חישובים אוטומטיים, תזכורות חכמות, גרסת ווב ודסקטופ."
    />
    <meta property="twitter:image" content="/icon-512.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#11676a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ten10" />

    <link rel="stylesheet" href="/loader.css" />
  </head>
  <body>
    <div id="root">
      <div
        id="pre-loader"
        dir="rtl"
        role="status"
        aria-live="polite"
        aria-busy="true"
      >
        <!-- The Ten10 symbol, inline so public/loader.css can colour it per theme. The spin is
             on the <svg> box, which keeps turning while the app's JavaScript loads. -->
        <svg
          class="brand-spinner pl-spin"
          viewBox="-40 -40 80 80"
          aria-hidden="true"
          focusable="false"
        >
          <path
            class="pl-ring"
            d="M20.82780,-3.27057c-0.21776,-1.34818 0.53172,-2.67371 1.77333,-3.23579l10.0772,-4.58369c1.78423,-0.80058 3.83109,0.2234 4.29811,2.12735c1.08394,4.50439 1.37218,9.2994 0.6947,14.20856c-2.64351,18.99669 -19.3918,33.24417 -38.55253,32.76026c-23.36233,-0.59043 -40.73704,-21.77337 -36.51019,-44.95425c3.1287,-17.16541 17.90183,-30.13248 35.33255,-31.02989c4.05497,-0.2041 7.95607,0.21184 11.61121,1.16514c1.85928,0.47316 2.83542,2.52118 2.0492,4.26575l-4.5011,9.9902c-0.57169,1.27911 -1.94364,2.05328 -3.32552,1.80839c-1.55373,-0.27262 -3.17084,-0.38919 -4.82946,-0.31076c-9.59142,0.45287 -17.8038,7.57191 -19.61006,17.0032c-2.48791,12.9612 7.2406,24.85476 20.30974,25.1162c9.47374,0.18304 18.01899,-6.19911 20.62852,-15.29945c0.89224,-3.10153 1.0098,-6.14677 0.55329,-9.01869z"
          />
          <g class="pl-fling">
            <path
              class="pl-slice"
              d="M12.14313,-7.97033c-0.43175,-0.46003 -2.32759,-2.50119 -2.78728,-2.92655c-1.53072,-1.38879 -2.77031,-2.26703 -1.54587,-4.61945l9.01306,-21.95482c0.76862,-1.68406 2.72423,-2.45695 4.43957,-1.76024c3.23775,1.32642 7.52368,3.30379 11.71833,8.0306c3.85522,4.3495 5.00069,7.15773 6.15109,10.05283c0.68139,1.72407 0.23756,3.67276 -1.38279,4.58677c0,0 -21.05398,8.80308 -21.29092,8.95616c-1.22058,0.75035 -2.9259,1.07316 -4.31519,-0.3653z"
            />
          </g>
        </svg>
        <div class="text">Ten10</div>
        <p data-loader-status>טוען...</p>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      (function () {
        function getStoredLanguage() {
          try {
            var i18nextLanguage = localStorage.getItem("i18nextLng");
            if (i18nextLanguage === "en" || i18nextLanguage === "he") {
              return i18nextLanguage;
            }

            var storedData = localStorage.getItem("Ten10-donation-store");
            var parsedData = storedData ? JSON.parse(storedData) : null;
            var language =
              parsedData &&
              parsedData.state &&
              parsedData.state.settings &&
              parsedData.state.settings.language;

            if (language === "en" || language === "he") {
              return language;
            }
          } catch (error) {
            // Fall back to Hebrew, matching the app's i18n default.
          }

          return "he";
        }

        var language = getStoredLanguage();
        var direction = language === "he" ? "rtl" : "ltr";
        var loader = document.getElementById("pre-loader");
        var loaderStatus = loader
          ? loader.querySelector("[data-loader-status]")
          : null;

        document.documentElement.lang = language;
        document.documentElement.dir = direction;

        if (loader) {
          loader.dir = direction;

          // Match a theme the user chose in the app, so the pre-loader doesn't flash
          // the wrong colours. "system" is left to the media query in loader.css.
          try {
            var storedTheme = localStorage.getItem("Ten10-ui-theme");
            if (storedTheme === "light" || storedTheme === "dark") {
              loader.setAttribute("data-theme", storedTheme);
            }
          } catch (error) {
            // Storage unavailable: loader.css follows the system colour scheme.
          }
        }

        if (loaderStatus) {
          loaderStatus.textContent =
            language === "he" ? "טוען..." : "Loading...";
        }
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
