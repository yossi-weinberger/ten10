name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run infrastructure guard tests
        run: npm run test:infra

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ratchet

  app-tests:
    name: Vitest (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Jerusalem]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application tests
        run: npm run test:app
        env:
          TZ: ${{ matrix.timezone }}

  edge-tests:
    name: Edge tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.5.2"

      - name: Install dependencies
        run: npm ci

      - name: Validate Edge Function imports
        run: npm run check-supabase-imports

      - name: Run Edge Function tests
        run: npm run test:edge
        env:
          TZ: UTC

      # Explicit file list: a bare `deno test <dir>` would also pick up Vitest *.test.ts files.
      - name: Run Deno parity tests
        run: |
          mapfile -t deno_tests < <(find supabase/functions -name '*_deno_test.ts' | sort)
          if [ "${#deno_tests[@]}" -eq 0 ]; then
            echo "No *_deno_test.ts files found" >&2
            exit 1
          fi
          printf 'Deno test: %s\n' "${deno_tests[@]}"
          deno test --config supabase/functions/deno.json "${deno_tests[@]}"

  # The Rust tests cover only src-tauri, but their setup (Tauri's system packages) can take
  # many minutes, so pull requests run them only when they touch src-tauri or this workflow.
  # A skipped job counts as passed for a required check. Pushes to main always run them.
  rust-changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Check the changed files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            echo "::warning::Could not list the pull request's files, so the Rust tests run."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in src-tauri or this workflow; the Rust tests are skipped."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  rust-tests:
    name: Rust tests
    needs: rust-changes
    if: needs.rust-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Tauri's system packages (~60 MB) come from a mirror that is sometimes very slow (16
      # minutes once), so the downloaded .deb files are cached. A new cache starts each month
      # from the last one: apt downloads only what changed, and autoclean drops versions the
      # mirror no longer serves. Caches saved by main are shared with all pull requests.
      - name: Name the system package cache
        id: apt-cache
        run: |
          prefix="tauri-apt-$ImageOS-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Tauri system packages
        uses: actions/cache@v6
        with:
          path: ~/tauri-apt-archives
          key: ${{ steps.apt-cache.outputs.key }}
          restore-keys: ${{ steps.apt-cache.outputs.prefix }}

      - name: Install Tauri system dependencies
        run: |
          archives="$HOME/tauri-apt-archives"
          mkdir -p "$archives/partial"
          apt_cache=(-o Dir::Cache::Archives="$archives" -o APT::Sandbox::User=root)
          sudo apt-get update
          sudo apt-get install --yes "${apt_cache[@]}" \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
          sudo apt-get "${apt_cache[@]}" autoclean
          # apt leaves root-only files here, which the cache can't save otherwise.
          sudo chown -R "$(id -u):$(id -g)" "$archives"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Prepare Tauri frontend fixture
        run: |
          mkdir -p dist
          printf '<!doctype html><title>Rust test fixture</title>' > dist/index.html

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
